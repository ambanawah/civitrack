apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: civitrack
  labels:
    app: grafana
    tier: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
        tier: monitoring
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3003
          env:
            - name: GF_SERVER_HTTP_PORT
              value: "3003"
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "civitrack123"
            - name: GF_DATASOURCES_DEFAULT_URL
              value: "http://prometheus:9090"

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: civitrack
spec:
  selector:
    app: grafana
  ports:
    - port: 3003
      targetPort: 3003
      nodePort: 30030
  type: NodePort
