apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: civitrack
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'gateway'
        static_configs:
          - targets: ['gateway:3000']

      - job_name: 'auth-service'
        static_configs:
          - targets: ['auth-service:3001']

      - job_name: 'complaint-service'
        static_configs:
          - targets: ['complaint-service:3002']

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: civitrack
  labels:
    app: prometheus
    tier: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
        tier: monitoring
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: civitrack
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090
  type: NodePort
