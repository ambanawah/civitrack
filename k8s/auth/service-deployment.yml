apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: civitrack
  labels:
    app: auth-service
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        tier: backend
    spec:
      containers:
        - name: auth-service
          image: carlos15976/civitrack-auth:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: civitrack-secrets
                  key: auth-db-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: civitrack-secrets
                  key: jwt-secret
            - name: JWT_EXPIRES_IN
              value: "7d"
          readinessProbe:
            httpGet:
              path: /auth/health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /auth/health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: civitrack
  labels:
    app: auth-service
spec:
  selector:
    app: auth-service
  ports:
    - port: 3001
      targetPort: 3001
  type: ClusterIP
